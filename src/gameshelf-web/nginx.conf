server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # security-headers.conf is written by docker-entrypoint.sh at container start (the CSP names
    # origins only known then). Every location includes it: add_header does not inherit into a
    # block that has its own.

    # Never cache the runtime config or the HTML shell; hashed assets can be cached forever.
    # A cached runtime-config.js would pin one environment's API URL and client id into a browser
    # across a promotion.
    location = /runtime-config.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes (including /login/callback) load the app shell.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
