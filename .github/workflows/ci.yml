# Continuous integration — runs on every push and pull request. Needs no cloud credentials.
#
#   tests   every suite inside docker-compose.test.yml, exactly what `npm test` runs locally:
#             backend   unit + contract + integration (against a throwaway SQL Server)
#             frontend  lint + typecheck + unit tests
#             e2e       Playwright against the real API and web images
#           Building the stack also proves both production images build.
#   bicep   templates compile
#
# There is deliberately no host-side toolchain here (no setup-dotnet / setup-node): the containers are
# the single way tests run, so CI and a developer's machine cannot drift apart.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test stack in containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Docker and Node (for the orchestrator script) are preinstalled on the runner.
      - name: Run every suite in docker-compose.test.yml
        run: node scripts/docker-test.mjs all

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test-results/backend/*.trx
            src/gameshelf-web/playwright-report
          if-no-files-found: ignore

  bicep:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build templates
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/bicep/env/dev.bicepparam --stdout > /dev/null
          # Phase 6 modules are not wired in yet but must still compile.
          az bicep build --file infra/bicep/modules/network.bicep --stdout > /dev/null
          az bicep build --file infra/bicep/modules/privateEndpoint.bicep --stdout > /dev/null
