# Continuous integration — runs on every push and pull request. Needs no cloud credentials.
#
#   backend     unit + contract tests, then integration tests against a SQL Server service container
#   frontend    lint, typecheck, unit tests, production build
#   e2e         Playwright against the real API + database
#   containers  the same three suites run inside docker-compose.test.yml (the exact command developers
#               run locally as `npm run test:docker`); this also proves both production images build
#   bicep       templates compile

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: 22
  SA_PASSWORD: GameShelf_Ci_Pa55word!
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: GameShelf_Ci_Pa55word!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GameShelf_Ci_Pa55word! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore GameShelf.sln

      - name: Build
        run: dotnet build GameShelf.sln --no-restore --configuration Release

      - name: Unit + contract tests
        run: >-
          dotnet test tests/GameShelf.Api.Tests --no-build --configuration Release
          --logger "trx;LogFileName=unit.trx" --results-directory test-results

      - name: Integration tests
        env:
          GAMESHELF_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=gameshelf_test;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
        run: >-
          dotnet test tests/GameShelf.Api.IntegrationTests --no-build --configuration Release
          --logger "trx;LogFileName=integration.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/gameshelf-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/gameshelf-web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: GameShelf_Ci_Pa55word!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P GameShelf_Ci_Pa55word! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/gameshelf-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/gameshelf-web
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: src/gameshelf-web
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the API (dotnet run, waits for /health/ready) and Vite itself.
      # Only the connection string needs to come from here: the CI SQL container has its own password.
      - name: Run Playwright
        working-directory: src/gameshelf-web
        env:
          CI: "true"
          VITE_API_BASE_URL: http://localhost:8080
          ConnectionStrings__GameShelf: "Server=localhost,1433;Database=gameshelf_e2e;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/gameshelf-web/playwright-report
          if-no-files-found: ignore

  containers:
    name: Test stack in containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # No setup-dotnet / setup-node: every toolchain comes from the images. Docker and Node (for the
      # orchestrator script) are preinstalled on the runner.
      - name: Run every suite in docker-compose.test.yml
        run: node scripts/docker-test.mjs all

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-test-results
          path: |
            test-results/backend/*.trx
            src/gameshelf-web/playwright-report
          if-no-files-found: ignore

  bicep:
    name: Bicep compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build templates
        run: |
          az bicep install
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
          az bicep build-params --file infra/bicep/env/dev.bicepparam --stdout > /dev/null
          # Phase 6 modules are not wired in yet but must still compile.
          az bicep build --file infra/bicep/modules/network.bicep --stdout > /dev/null
          az bicep build --file infra/bicep/modules/privateEndpoint.bicep --stdout > /dev/null
