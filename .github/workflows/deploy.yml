#         --image "${LOGIN_SERVER}/gameshelf-migrate:${IMAGE_TAG}" \
#         --subnet <snet-migration id> --assign-identity <deploy identity id> \
#         --acr-identity <deploy identity id> --restart-policy Never \
#         --environment-variables CONNECTION="...Authentication=Active Directory Managed Identity;User Id=<deploy clientId>;"
